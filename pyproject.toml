[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "papersplease"
version = "0.4.0"
description = "An agent-native literature crawler: searches, reads, screens each paper for scope, then hands back Sci-Hub links."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "PapersPlease contributors" }]
keywords = ["literature-review", "sci-hub", "mcp", "agents", "doi", "research", "scope"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Topic :: Scientific/Engineering",
  "Topic :: Text Processing :: Linguistic",
]
# The core tool is deliberately dependency-free: stdlib only.
dependencies = []

[project.optional-dependencies]
# Only needed for `--deep` full-text PDF reading.
pdf = ["pypdf>=4.0"]

[project.scripts]
papersplease = "papersplease.cli:main"

[tool.setuptools.packages.find]
include = ["papersplease*"]
